<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سينما بلس — إدخال بيانات الاشتراك</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f13;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1a22;
      border: 1px solid #2a2a35;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.6rem;
      font-weight: 800;
      color: #e50914;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #a0a0b0;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .device-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(229, 9, 20, 0.15);
      color: #ff6b73;
      border: 1px solid rgba(229, 9, 20, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .form-group {
      text-align: right;
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #a0a0b0;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      background: #0f0f13;
      border: 1px solid #2a2a35;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus {
      border-color: #e50914;
      box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
    }
    .btn-submit {
      width: 100%;
      background: #e50914;
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-submit:hover { background: #f40612; transform: translateY(-2px); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    /* أنيميشن النجاح والتحميل */
    .status-state { display: none; padding: 20px 0; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #2a2a35;
      border-top-color: #e50914;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <i class="fas fa-play-circle"></i>
      <span>سينما بلس</span>
    </div>
    <p class="subtitle">إدخال بيانات الاشتراك</p>

    <div class="device-badge">
      <i class="fas fa-tv"></i>
      <span>ربط مباشر مع الشاشة</span>
    </div>

    <!-- نموذج الإدخال -->
    <form id="pairForm" onsubmit="sendToDevice(event)">
      <div class="form-group">
        <label>رابط السيرفر</label>
        <input type="text" id="url" placeholder="http://server.com:8080" required autocomplete="url">
      </div>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="user" placeholder="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="pass" placeholder="password" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label>الاسم الظاهر (اختياري)</label>
        <input type="text" id="name" placeholder="مثال: شاشة المجلس">
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">
        <i class="fas fa-paper-plane"></i> إرسال للشاشة
      </button>
    </form>

    <!-- حالة التحميل -->
    <div id="loadingState" class="status-state">
      <div class="spinner"></div>
      <h3>جاري الإرسال للشاشة...</h3>
      <p style="color:#a0a0b0; font-size:0.85rem; margin-top:6px">خليك بالصفحة ثواني بسيطة</p>
    </div>

    <!-- حالة النجاح -->
    <div id="successState" class="status-state">
      <div class="success-icon"><i class="fas fa-check"></i></div>
      <h3 style="color:#4ade80">تم تسجيل دخولك بنجاح!</h3>
      <p style="color:#a0a0b0; font-size:0.85rem; margin-top:8px">تم إرسال البيانات للشاشة، يمكنك إغلاق هذه الصفحة الآن.</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const topic = urlParams.get('topic');

    async function sendToDevice(e) {
      e.preventDefault();
      if (!topic) {
        alert('رمز الاقتران غير صالح أو مفقود!');
        return;
      }

      const btn = document.getElementById('submitBtn');
      const form = document.getElementById('pairForm');
      const loading = document.getElementById('loadingState');
      const success = document.getElementById('successState');

      const data = {
        url: document.getElementById('url').value.trim(),
        user: document.getElementById('user').value.trim(),
        pass: document.getElementById('pass').value.trim(),
        name: document.getElementById('name').value.trim() || 'الشاشة'
      };

      form.style.display = 'none';
      loading.style.display = 'block';

      try {
        const res = await fetch('https://ntfy.sh/' + topic, {
          method: 'POST',
          body: JSON.stringify(data)
        });

        if (res.ok) {
          loading.style.display = 'none';
          success.style.display = 'block';
        } else {
          throw new Error('فشل الإرسال');
        }
      } catch (err) {
        alert('تعذر الاتصال بالشاشة، تأكد من اتصال الإنترنت وحاول مجدداً.');
        loading.style.display = 'none';
        form.style.display = 'block';
      }
    }
  </script>
</body>
</html>
